{% load static %}

<section id="accueil" aria-labelledby="hero-title"
    class="relative isolate overflow-hidden bg-background text-foreground">
    <!-- Formes de fond purement décoratives -->
    <div aria-hidden="true" class="pointer-events-none absolute inset-0 -z-10 overflow-hidden">
        <div
            class="absolute -right-28 top-16 size-72 rounded-full bg-primary/10 blur-3xl sm:size-96 lg:right-0 lg:top-24">
        </div>
        <div class="absolute -left-32 bottom-0 size-72 rounded-full bg-highlight/10 blur-3xl"></div>
        <div class="absolute inset-x-0 bottom-0 h-px bg-border"></div>
    </div>

    <div
        class="page-content grid --min-h-[calc(100svh-4.5rem)] items-center gap-14 py-16 sm:gap-16 sm:py-20 lg:grid-cols-[minmax(0,1.18fr)_minmax(20rem,.82fr)] lg:gap-20 lg:py-24 xl:gap-24">
        <div class="relative z-10 max-w-4xl">
            <!-- Introduction -->
            <div class="flex items-center gap-3">
                <span class="relative flex size-2.5 shrink-0" aria-hidden="true">
                    <span
                        class="absolute inline-flex size-full animate-ping rounded-full bg-primary opacity-40 motion-reduce:animate-none"></span>
                    <span class="relative inline-flex size-2.5 rounded-full bg-primary"></span>
                </span>
                <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-primary sm:text-xs">
                    <span>&lt;/DEV&gt;</span>
                </p>
            </div>

            <!-- Grand titre -->
            <h1 id="hero-title"
                class="mt-5 max-w-4xl text-[clamp(3rem,8.5vw,6.6rem)] font-bold leading-[.92] tracking-[-0.075em] sm:mt-7 lg:text-[clamp(2.5rem,5vw,4.6rem)]">
                Du code soigné, un
                <span class="text-primary">impact</span> concret.
            </h1>

            <div
                class="mt-9 flex max-w-2xl flex-col gap-8 border-l-2 border-primary/30 pl-5 sm:mt-12 sm:pl-7 lg:flex-row lg:items-end lg:justify-between lg:gap-10">
                <p class="max-w-xl text-base leading-8 text-muted-foreground sm:text-lg">
                    Je développe des applications web modernes, de l'interface utilisateur aux API et à la logique
                    métier. Mon objectif&nbsp;: construire des solutions performantes, fiables et évolutives.
                </p>

                <a href="{% url 'portfolio' %}"
                    class="group inline-flex h-12 w-full shrink-0 items-center justify-center gap-2 rounded-full bg-primary px-7 text-sm font-semibold text-primary-foreground shadow-sm transition-colors hover:bg-primary/90 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ring sm:w-fit">
                    Explorer mes réalisations
                    <c-icons.arrow_right />
                </a>
            </div>
        </div>

        <!-- Portrait éditorial -->
        <div class="group relative mx-auto w-full max-w-[22rem] sm:max-w-[22rem] lg:mx-0 lg:ml-auto lg:max-w-[24rem]">
            <div aria-hidden="true"
                class="absolute -inset-y-5 left-7 right-0 rounded-[2.75rem] border border-primary/30 sm:-inset-y-7 sm:left-10">
            </div>
            <div aria-hidden="true"
                class="absolute -right-5 -top-7 size-28 rounded-full bg-secondary sm:-right-8 sm:-top-10 sm:size-36">
            </div>
            <div aria-hidden="true"
                class="absolute -bottom-8 -left-5 grid grid-cols-3 gap-2 rounded-2xl border border-border bg-background p-4 shadow-lg sm:-left-9">
                <span class="size-1.5 rounded-full bg-primary"></span>
                <span class="size-1.5 rounded-full bg-primary/50"></span>
                <span class="size-1.5 rounded-full bg-primary/20"></span>
                <span class="size-1.5 rounded-full bg-primary/50"></span>
                <span class="size-1.5 rounded-full bg-primary/20"></span>
                <span class="size-1.5 rounded-full bg-primary"></span>
            </div>

            <figure
                class="relative overflow-hidden rounded-[2.5rem_2.5rem_.75rem_2.5rem] border border-border bg-card p-2 shadow-2xl shadow-primary/15">
                <div class="relative aspect-[4/5] overflow-hidden rounded-[2rem_2rem_.5rem_2rem] bg-muted">
                    <img src="{% static 'images/profile-photo.webp' %}" width="949" height="949"
                        alt="Portrait de Gustave Kuetenang, développeur Full-Stack"
                        class="size-full object-cover object-center motion-safe:transition-transform motion-safe:duration-700 group-hover:scale-[1.025]"
                        decoding="async" fetchpriority="high">
                    <div aria-hidden="true"
                        class="absolute inset-x-0 bottom-0 h-1/3 bg-gradient-to-t from-navy/80 to-transparent"></div>
                </div>

                <figcaption
                    class="absolute inset-x-6 bottom-6 rounded-2xl border border-cream/15 bg-navy/90 px-5 py-4 text-cream shadow-lg backdrop-blur-sm sm:inset-x-auto sm:left-6 sm:min-w-56">
                    <span class="block text-[10px] font-bold uppercase tracking-[0.2em] text-soft-green">Gustave
                        Kuetenang</span>
                    <span class="mt-1 block text-sm font-medium text-cream/80">Développeur Full-Stack</span>
                </figcaption>
            </figure>

            <div aria-hidden="true"
                class="absolute -right-3 bottom-16 flex h-24 w-8 items-center justify-center rounded-full border border-border bg-background shadow-md sm:-right-5">
                <span class="h-12 w-px bg-primary"></span>
            </div>
        </div>
    </div>
</section>
