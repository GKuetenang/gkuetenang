{# Contact V2 — bandeau principal ; la navigation est définie dans base.html #}
<section aria-labelledby="contact-hero-title" class="relative isolate overflow-hidden bg-navy text-cream">
  <!-- Motifs géométriques, sans image ni CSS personnalisé -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden">
    <div
      class="absolute -right-40 -top-60 size-[26rem] rotate-45 rounded-[5rem] border border-violet/35 bg-violet/10 sm:-right-20 sm:size-[36rem]">
    </div>
    <div
      class="absolute -right-40 top-32 size-72 rotate-45 rounded-[5rem] border border-lavender/20 bg-violet/15 lg:right-4 lg:size-[28rem]">
    </div>
    <div class="absolute bottom-0 right-1/4 hidden h-52 w-px bg-lavender/10 lg:block"></div>
    <div class="absolute right-1/3 top-24 hidden size-1 rounded-full bg-lavender/60 lg:block"></div>
    <div class="absolute inset-x-0 bottom-0 h-px bg-cream/15"></div>
  </div>

  <div class="relative mx-auto max-w-7xl px-5 pb-20 pt-16 sm:px-8 sm:pb-24 sm:pt-20 lg:px-12 lg:pb-24 lg:pt-24">
    <p class="mb-6 text-[11px] font-bold uppercase tracking-[0.24em] text-lavender">Contact</p>

    <h1 id="contact-hero-title"
      class="max-w-5xl text-[clamp(2.75rem,5vw,4.75rem)] font-semibold leading-[1.06] tracking-[-0.065em]">
      Parlons de votre<br>
      <span class="text-primary">prochain</span>
      <span class="relative inline-block text-soft-green">
        projet.
        <span aria-hidden="true" class="absolute -bottom-2 left-1 h-1 w-1/2 rounded-full bg-soft-green"></span>
      </span>
    </h1>

    <p class="mt-9 max-w-xl text-base leading-8 text-cream/80 sm:text-lg">
      Une idée, un besoin ou une question ? Échangeons sur votre projet
      pour construire une solution fiable et adaptée à vos objectifs.
    </p>
  </div>
</section>
